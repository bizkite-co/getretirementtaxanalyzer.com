<form class="signup-form" id="{{ signup_form_id }}" data-form-location="{{ signup_form_location }}">
  <div class="row g-2 align-items-stretch">
    <div class="col-12 col-md-6 col-lg">
      <input type="text" class="form-control h-100" id="{{ signup_form_id }}-name" name="name" placeholder="Full name" aria-label="Full name" autocomplete="name" required>
    </div>
    <div class="col-12 col-md-6 col-lg">
      <input type="email" class="form-control h-100" id="{{ signup_form_id }}-email" name="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
    </div>
    <div class="col-12 col-lg-auto d-grid">
      <button type="submit" class="btn btn-primary text-nowrap signup-submit-btn">Request a Callback</button>
    </div>
    <div class="col-12">
      <div class="alert alert-success mt-2 mb-0 d-none signup-success-msg" role="status" aria-live="polite">
        <strong>Thanks!</strong> We've got your info and will reach out shortly.
      </div>
      <div class="alert alert-danger mt-2 mb-0 d-none signup-error-msg" role="alert">
        <strong>Sorry, that didn't go through.</strong> Please try again, or email
        <a href="mailto:mark@bizkite.net">mark@bizkite.net</a> directly.
      </div>
    </div>
  </div>
</form>
